# Default values. Environment-specific overrides live in values-dev.yaml / values-prod.yaml.

replicaCount: 1

image:
  repository: localhost:5000/hello-devops
  tag: latest
  pullPolicy: IfNotPresent

environment: local

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

# Requests = what the scheduler reserves; limits = hard ceiling.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
